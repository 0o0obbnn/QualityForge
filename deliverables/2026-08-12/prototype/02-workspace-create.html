<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建项目 · QualityForge</title>
<link rel="stylesheet" href="assets/qf-tokens.css">
<link rel="stylesheet" href="assets/qf-components.css">
</head>
<body data-page="create">
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark"><svg viewBox="0 0 16 16" width="15" height="15" fill="none"><path d="M3 12.5 8 3l5 9.5H3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></span>QualityForge</div>
    <div class="nav-group">工作</div>
    <button class="nav-item" data-nav="board" onclick="location.href='10-board.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6h12M5.5 9h2M5.5 11.5h4"/></svg>任务看板</button>
    <div class="nav-group">测试</div>
    <button class="nav-item" data-nav="knowledge" onclick="location.href='20-sources.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>知识与契约</button>
    <button class="nav-item" data-nav="planning" onclick="location.href='30-strategies.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M3 8h10M3 12h6"/><circle cx="13" cy="12" r="1.6"/></svg>测试规划与设计</button>
    <button class="nav-item" data-nav="automation" onclick="location.href='40-scripts.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12.5V3.5h8v9H4Z"/><path d="M6 6h4M6 8.5h4"/></svg>自动化工作台</button>
    <button class="nav-item" data-nav="execution" onclick="location.href='50-execution-plans.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 13.5h11M4 13.5V8l4-3 4 3v5.5"/></svg>测试执行</button>
    <button class="nav-item" data-nav="quality" onclick="location.href='60-analyses.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.5 13.5 13.5h-11L8 2.5Z"/><path d="M8 7v3M8 12.2v.3"/></svg>质量中心</button>
    <div class="nav-group">平台</div>
    <button class="nav-item" data-nav="agent" onclick="location.href='70-capabilities.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.4"/><path d="M8 2.8v2M8 11.2v2M2.8 8h2M11.2 8h2"/></svg>AI Agent 中心</button>
    <button class="nav-item" data-nav="platform" onclick="location.href='80-workspaces.html'"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2"/></svg>平台管理</button>
  </aside>

  <header class="topbar">
    <div class="ctx">
      <button class="ctx-btn"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5.5 8 2l6 3.5v8h-4.5V10h-3v3.5H2v-8Z"/></svg>尚未选择项目</button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" onclick="qf.toast('暂无新通知','info')"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.5a4 4 0 0 1 4 4v3l1.5 2h-11L4 9.5v-3a4 4 0 0 1 4-4Z"/><path d="M6.5 13a1.6 1.6 0 0 0 3 0"/></svg></button>
    <div class="avatar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><circle cx="8" cy="5.6" r="2.6"/><path d="M3.5 13.5c.6-2.4 2.4-3.6 4.5-3.6s3.9 1.2 4.5 3.6"/></svg></div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>创建项目</h1>
        <div class="sub">项目是测试工作的数据与权限边界(对应 Workspace 实体)</div>
      </div>
      <div class="spacer"></div>
      <a class="btn btn-ghost" href="80-workspaces.html">返回项目列表</a>
    </div>

    <div class="two-col">
      <div class="card">
        <form id="wsForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label>项目名称 <span class="req">*</span></label>
              <input class="input" name="name" required maxlength="60" placeholder="例如: 结算中心">
              <div class="err">请输入项目名称</div>
            </div>
            <div class="field">
              <label>项目标识 <span class="req">*</span></label>
              <input class="input" name="key" required maxlength="20" placeholder="例如: settlement (小写字母数字)" pattern="[a-z0-9-]+">
              <div class="err">标识仅支持小写字母、数字与连字符</div>
            </div>
          </div>
          <div class="field">
            <label>项目描述</label>
            <textarea class="input" name="desc" placeholder="一句话说明这个项目测什么、服务谁"></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label>起始模板</label>
              <select class="input" name="template">
                <option>Web 应用测试 (默认)</option>
                <option>API 服务测试</option>
                <option>移动 App 测试</option>
                <option>空白项目</option>
              </select>
            </div>
            <div class="field">
              <label>测试类型偏好</label>
              <select class="input" name="types">
                <option>功能 + API</option>
                <option>仅功能</option>
                <option>功能 + API + 性能</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>邀请成员</label>
            <input class="input" type="email" multiple placeholder="输入成员邮箱,回车添加">
            <div class="hint">创建后可在「平台管理 → 项目与 Release」中继续管理成员与角色</div>
          </div>
          <div class="field">
            <label class="check"><input type="checkbox" name="autoRelease" checked> 同时创建首个 Release(R-2026.08)</label>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" onclick="qf.toast('已放弃创建','info')">取消</button>
            <button type="submit" class="btn btn-primary">创建项目</button>
          </div>
        </form>
      </div>

      <div class="aside-stack">
        <div class="mini-card">
          <h2>项目 = Workspace</h2>
          <div class="row"><span class="k">数据边界</span><span class="v">租户内隔离</span></div>
          <div class="row"><span class="k">权限边界</span><span class="v">四级作用域</span></div>
          <div class="row"><span class="k">Release</span><span class="v">项目内交付批次</span></div>
          <div class="row"><span class="k">不创建</span><span class="v">Project 双实体</span></div>
        </div>
        <div class="mini-card">
          <h3>创建后自动配置</h3>
          <div class="row"><span class="k">默认角色</span><span class="v">Admin / Lead / Engineer</span></div>
          <div class="row"><span class="k">默认审核策略</span><span class="v">SINGLE_REVIEW</span></div>
          <div class="row"><span class="k">默认环境</span><span class="v">dev / staging</span></div>
          <div class="row"><span class="k">AI 自治</span><span class="v">L2 受限代理</span></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/qf-shell.js"></script>
<script>
  qf.bindForm('wsForm', function (f) {
    var data = {
      name: f.name.value, key: f.key.value, desc: f.desc.value,
      template: f.template.value, autoRelease: f.autoRelease.checked, at: Date.now()
    };
    var list = qf.store.get('workspaces', []);
    list.unshift(data);
    qf.store.set('workspaces', list);
    qf.store.set('currentWs', data.name);
    qf.toast('项目「' + data.name + '」创建成功,已持久化(刷新可复核)', 'ok');
    setTimeout(function () { location.href = '10-board.html'; }, 700);
  });
</script>
</body>
</html>
