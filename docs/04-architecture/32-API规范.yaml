        按 lastBusinessUpdatedAt DESC（最近有效更新优先）；
        WP-01 常用项目固定后行内附 pinned=true 并置顶排序（置顶组内仍按最近有效更新）。lastBusinessUpdatedAt = 该工作区 19 类
        业务领域事件（artifact.version.generated / asset.published / stage.invalidated / review.decided / work_item.transitioned /
        work_item.assigned / session.converged / execution.started / execution.finished /
        evidence.appended / defect.version.created / conversation.message.appended /
        clarification.requested / clarification.responded / task_card.created /
        agent_plan.decided / run_command.recorded / runtime_authorization.decided /
        budget.updated）的最大
        occurredAt，排除 provider.switched /
        provider.failover 运行面事件；无事件回退 createdAt。只读查询与 Agent Trace 不产生领域
        事件，故轮询/Trace 不刷新排序（QF-PD-020/023 负向承载面）。
      responses: { '200': { $ref: '#/components/responses/WorkspaceListResponse' } }
    post:
      tags: [Platform]
      operationId: createWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/WorkspaceResponse' } }
