        幂等重放：同键同指纹返回原发布结果；发布不自动改写下游（执行冻结引用的失效联动随 WP-06 冻结面落地）。
        负向：脚本或版本不存在 404、跨 Workspace 403、Agent 调用 403、非 APPROVED 409 ASSET_NOT_APPROVED。
      parameters:
        - name: scriptVersionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { $ref: '#/components/responses/GenericObjectResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
