    get:
      tags: [Platform]
      operationId: listRoleBindings
      parameters: [ { $ref: '#/components/parameters/WorkspaceIdQuery' } ]
      responses: { '200': { $ref: '#/components/responses/GenericListResponse' } }
    post:
      tags: [Platform]
      operationId: createRoleBinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleBindingCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/GenericObjectResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /platform/audit-logs:
    get:
      tags: [Platform]
      operationId: listAuditLogs
      parameters: [ { $ref: '#/components/parameters/WorkspaceIdQuery' }, { $ref: '#/components/parameters/PageParam' } ]
      responses: { '200': { $ref: '#/components/responses/GenericListResponse' } }
  /observability/events:
    get:
      tags: [Observability]
      operationId: listEvents
      description: >-
        领域事件流只读面：append-only、服务端独占生成、无客户端写入面（AC-04 防伪基线）；
        支持 subjectType/eventType 过滤，承载 D3 效率指标计算与试点追溯。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - { name: subjectType, in: query, schema: { type: string } }
        - { name: eventType, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses: { '200': { $ref: '#/components/responses/GenericListResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /observability/metrics:
    get:
      tags: [Observability]
      operationId: listMetrics
      description: >-
        受控 metricKey 计算面（20 号 §1.1 O3 裁决 ✅ 可计算项）：纯服务端计算零手工录入，
        每项返回 metricKey/value/denominator/window/computedAt 并显式声明分母口径；不含目标值（AC-04）。
      parameters: [ { $ref: '#/components/parameters/WorkspaceIdQuery' } ]
      responses: { '200': { $ref: '#/components/responses/GenericListResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /auth/status:
    get:
      tags: [Platform]
      operationId: getLocalAuthStatus
      security: []
      responses: { '200': { $ref: '#/components/responses/LocalAuthStatusResponse' } }
  /auth/setup:
    post:
      tags: [Platform]
      operationId: setupLocalAdmin
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalSetupCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/LocalAuthProfileResponse' }, '409': { $ref: '#/components/responses/Conflict' } }
  /auth/login:
    post:
      tags: [Platform]
      operationId: loginLocalUser
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginCreate' } } } }
      responses: { '200': { $ref: '#/components/responses/LocalAuthProfileResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /auth/switch-workspace:
    post:
      tags: [Platform]
      operationId: switchLocalWorkspace
      description: >-
        WP-01A 专用切换命令（QF-PD-001/002/009 承载面）：目标 workspaceId 必须属于当前身份的
        生效成员关系，否则 403；校验通过后服务端重签 JWT 并刷新会话 cookie（工作区绑定进
        token claim，资源型端点的 actor 工作区随切换生效）。不落库、不用通用 PATCH 代替命令。
      parameters: [ { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceSwitch' } } } }
      responses: { '200': { $ref: '#/components/responses/LocalAuthProfileResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/me:
    get:
      tags: [Platform]
      operationId: getCurrentLocalUser
      responses: { '200': { $ref: '#/components/responses/LocalAuthProfileResponse' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/logout:
    post:
      tags: [Platform]
      operationId: logoutLocalUser
      parameters: [ { $ref: '#/components/parameters/CsrfToken' } ]
      responses: { '200': { $ref: '#/components/responses/LoggedOutResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /auth/ws-tickets:
    post:
      tags: [Platform]
      operationId: createWebSocketTicket
      description: >-
        为已通过REST鉴权的调用方签发一次性、短时有效且绑定具体资源的WebSocket票据；
        票据不得复用，也不得扩大调用方已有权限。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebSocketTicketCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/GenericObjectResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }

