        - name: releaseId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { $ref: '#/components/responses/ReleaseArchiveResponse' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
