        归档后从 listReleases 与前端切换面消失；createWorkItem 携带已归档 releaseId 按
        RELEASE_NOT_IN_WORKSPACE 同码 409 拒绝。重复归档 409 RELEASE_ALREADY_ARCHIVED。
        配置域命令不产生领域事件（同批次四十六 environment.create 口径）。
