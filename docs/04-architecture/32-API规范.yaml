openapi: 3.0.3
info:
  title: QualityForge Core API
  version: 2.0.0-draft
  description: >-
    QualityForge目标API契约。Stage 4已实现planning纵向切片、本地认证和审核产物读取共22个operation；其余仍为目标设计，
    本文件尚不是已发布线上兼容面。
    JSON字段统一camelCase；数据库物理列使用snake_case。产品版本V0/V1/V2/V3与API代际分离。
x-contract-status: draft
x-product-contract: ../01-product/05-功能模块重构方案.md
x-product-baseline: ../01-product/06-人机协作与V1业务基线.md
x-pending-collaboration-contract: 39-人机协作目标契约.md
servers:
  - url: /api/v1
    description: 首个产品交付API代际；旧设计稿未形成运行时兼容承诺
security:
  - BearerAuth: []
  - CookieAuth: []
tags:
  - { name: WorkBoard, description: 工作项与人工审核 }
  - { name: Knowledge, description: 来源、需求、API契约与知识 }
  - { name: TestPlanning, description: 策略、计划、场景、用例与套件 }
  - { name: Automation, description: 自动化代码、数据、Locator与Mock }
  - { name: Execution, description: 执行计划、任务、结果与证据 }
  - { name: Quality, description: 分析、Defect、报告、门禁与流水线 }
  - { name: AIAgentCenter, description: Agent、Skill、Workflow、Trace与Eval }
  - { name: Platform, description: Workspace、Release、环境、身份、安全与基础设施 }
  - { name: Observability, description: 领域事件流与受控指标（D3/O3 裁决承载面） }
  - { name: Collaboration, description: 协作对话、澄清、任务卡与AgentPlan（39 号 §3，批次五十三激活未实现） }
  - { name: RunControl, description: 运行命令、授权、预算与检查点（39 号 §4-§5，批次五十七激活未实现） }

paths:
  # ===== WP-03 协作对话/澄清/任务卡/AgentPlan（39 号 §3 契约激活，批次五十三；全部 KNOWN_DEFERRED，未实现）=====
  /conversations:
    get:
      tags: [Collaboration]
      operationId: listConversations
      description: >-
        协作会话列表（Owner=协作域；能力键 conversation.read）。查询可无 Release（releaseId 过滤
        可选）；负向：跨 Workspace 403。实现批次登记 conversation.* 事件与 36 号 stream 主题。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses: { '200': { $ref: '#/components/responses/ConversationListResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Collaboration]
      operationId: createConversation
      description: >-
        创建当前项目/Release 协作会话（Owner=协作域；能力键 conversation.write；Idempotency-Key）。
        负向：跨 Workspace 403；挂接的 workItemId 不存在或跨 Workspace 404/409。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/ConversationResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /conversations/{conversationId}/messages:
    get:
      tags: [Collaboration]
      operationId: listConversationMessages
      description: >-
        会话消息列表（只追加日志，游标分页；能力键 conversation.read）。负向：跨 Workspace 403、会话不存在 404。
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses: { '200': { $ref: '#/components/responses/ConversationMessageListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Collaboration]
      operationId: createConversationMessage
      description: >-
        追加用户或 Agent 可审计消息（能力键 conversation.write；Idempotency-Key）。只追加、不可改写；
        敏感正文按 contentRef 引用存储（dataClass 分级）；actorType=USER 由令牌决定、AGENT 须归属本会话
        的 Session。负向：跨 Workspace 403、会话不存在 404、AGENT 冒名 403、digest 不符 422。
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationMessageCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/ConversationMessageResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /ai/sessions/{agentSessionId}/clarifications:
    get:
      tags: [Collaboration]
      operationId: listClarificationRequests
      description: >-
        Session 澄清请求列表（状态 OPEN/ANSWERED/CANCELLED/EXPIRED；能力键 conversation.read）。
        负向：跨 Workspace 403、Session 不存在 404。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: agentSessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/ClarificationRequestListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Collaboration]
      operationId: createClarificationRequest
      description: >-
        AI 发起澄清并阻塞会话（Owner=Agent 协作域；能力键 clarification.raise，仅 AGENT 会话链路；
        Idempotency-Key）。提出后归属 Session 转 BLOCKED，答复前不得推进。
        负向：跨 Workspace 403、Session 不存在 404、Session 已终态 409、人工冒用 403。
      parameters:
        - name: agentSessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClarificationRequestCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/ClarificationRequestResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /clarifications/{clarificationId}/responses:
    post:
      tags: [Collaboration]
      operationId: respondClarification
      description: >-
        人工答复澄清并形成 CONFIRMED 证据（能力键 clarification.respond，仅 USER；Idempotency-Key）。
        evidenceClass 固定 CONFIRMED，answerRef 引用存储；答复后解除 Session BLOCKED。
        负向：不存在 404、已 ANSWERED 409、AGENT 答复 403、非 OPEN 状态 409。
      parameters:
        - name: clarificationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClarificationResponseCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/ClarificationResponseResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /work-items/{workItemId}/task-cards:
    get:
      tags: [Collaboration]
      operationId: listTaskCards
      description: >-
        工作项的任务卡版本列表（能力键 task_card.read，资源型端点取 actor 绑定工作区）。
        版本取代语义：同工作项旧卡 SUPERSEDED 留痕。负向：工作项不存在 404、跨 Workspace 403。
        批次六十一契约先行补充（39 号 §3.1 未列读面，前端纵向需要）。
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/TaskCardListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Collaboration]
      operationId: createTaskCard
      description: >-
        固化正式任务输入（Owner=WorkBoard 协作域；能力键 task_card.create；Idempotency-Key）。
        对话生成或人工直接填写；提交后不可静默扩展（后续变更走新版本）。
        负向：工作项不存在 404、跨 Workspace 403、未解高风险澄清 409、无 Release 的交付任务 409。
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCardCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/TaskCardResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /work-items/{workItemId}/agent-plans:
    get:
      tags: [Collaboration]
      operationId: listAgentPlans
      description: >-
        工作项的 AgentPlan 版本列表（DRAFT/PENDING_APPROVAL/APPROVED/REJECTED/SUPERSEDED；能力键 agent_plan.read）。
        负向：跨 Workspace 403、工作项不存在 404。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/AgentPlanListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Collaboration]
      operationId: createAgentPlan
      description: >-
        创建执行计划版本（Owner=Agent 协作域；能力键 agent_plan.create；Idempotency-Key）。
        基于 TaskCard 生成，新版本使旧计划 SUPERSEDED；仅 APPROVED 计划可启动 Session。
        负向：工作项/TaskCard 不存在 404、TaskCard 未提交 409、跨 Workspace 403。
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPlanCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/AgentPlanResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /agent-plans/{agentPlanId}/decisions:
    post:
      tags: [Collaboration]
      operationId: decideAgentPlan
      description: >-
        人工批准或拒绝计划（Owner=WorkBoard 审核域；能力键 agent_plan.decide，仅 USER；Idempotency-Key）。
        决定引用计划 contentDigest（摘要漂移 409 STALE_ARTIFACT_VERSION）；Agent 不得自批。
        负向：计划不存在 404、非 PENDING_APPROVAL 409、AGENT 决定 403、digest 漂移 409。
      parameters:
        - name: agentPlanId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AgentPlanDecisionCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/AgentPlanDecisionResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  # ===== WP-04 运行命令/授权/预算/检查点（39 号 §5 契约激活，批次五十七；全部 KNOWN_DEFERRED，未实现）=====
  /ai/sessions/{agentSessionId}/commands:
    post:
      tags: [RunControl]
      operationId: commandAgentSession
      description: >-
        对 Agent 会话下发统一运行命令（Owner=Agent 运行域；能力键 run_command.issue；仅 USER；
        Idempotency-Key）。commandType ∈ PAUSE/RESUME/CANCEL/RETRY/AUTHORIZE/REVOKE；命令只追加、
        不直接等于生效——生效以 CommandReceipt 为唯一回执（accepted=false 时附原因码）。
        暂停/取消到安全点生效；RESUME 必须重新验证输入摘要、权限、预算与环境；
        RETRY 创建新 attempt 并引用原失败记录。负向：会话不存在 404、跨 Workspace 403、
        Agent 下发 403、终态会话非 RETRY 命令 409、命令重放同键返回原命令。
        本切片实装 PAUSE/RESUME/CANCEL（批次五十八）；RETRY/AUTHORIZE/REVOKE 契约枚举保留、
        运行时 422 显式拒绝，不虚报可实装面。
      parameters:
        - name: agentSessionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunCommandCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RunCommandResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /execution-tasks/{executionTaskId}/commands:
    post:
      tags: [RunControl]
      operationId: commandExecutionTask
      description: >-
        对执行任务下发统一运行命令（Owner=执行域；能力键 run_command.issue；仅 USER；Idempotency-Key）。
        语义与负向同 commandAgentSession；执行任务的 PAUSE/CANCEL 到安全点落 Checkpoint。
        负向：任务不存在 404、跨 Workspace 403、已终态任务非 RETRY 409。
        本切片实装 PAUSE/RESUME/CANCEL（批次五十八）；RETRY/AUTHORIZE/REVOKE 运行时 422 未实装。
      parameters:
        - name: executionTaskId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunCommandCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RunCommandResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /run-commands/{runCommandId}:
    get:
      tags: [RunControl]
      operationId: getRunCommandReceipt
      description: >-
        查询命令与其实际生效回执（能力键 run_command.read）。CommandReceipt 是命令是否生效的唯一事实；
        未到安全点时 accepted=false 并给出等待原因码。负向：命令不存在 404、跨 Workspace 403。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: runCommandId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/RunCommandReceiptResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /work-items/{workItemId}/authorizations:
    get:
      tags: [RunControl]
      operationId: listRuntimeAuthorizations
      description: >-
        工作项的运行时授权列表（能力键 runtime_authorization.read）。授权含 permissionKeys/
        resourceScope/secretRefs（只引用不泄露明文）/budgetDelta/有效期；决定只追加。
        负向：工作项不存在 404、跨 Workspace 403。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/RuntimeAuthorizationListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [RunControl]
      operationId: createRuntimeAuthorization
      description: >-
        创建运行时授权或撤销（Owner=治理域；能力键 runtime_authorization.manage；仅 USER；Idempotency-Key）。
        AUTHORIZE/REVOKE 均为只追加决定；Agent 无权自授。负向：工作项不存在 404、跨 Workspace 403、
        Agent 授权 403、有效期倒置 422。
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeAuthorizationCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RuntimeAuthorizationResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /work-items/{workItemId}/budgets:
    get:
      tags: [RunControl]
      operationId: getWorkItemBudget
      description: >-
        工作项预算策略与消耗快照（能力键 budget.read）。达到上限自动暂停；Agent 无权上调。
        负向：工作项不存在 404、跨 Workspace 403。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/BudgetPolicyResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [RunControl]
      operationId: updateWorkItemBudget
      description: >-
        更新预算策略（能力键 budget.manage；仅 USER；Idempotency-Key）。Agent 上调 403；
        收紧可即时生效，放宽需重新预检在途执行。负向：工作项不存在 404、跨 Workspace 403、
        非法阈值（上限<已消耗）409/422。
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BudgetPolicyUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/BudgetPolicyResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /runs/{targetType}/{targetId}/checkpoints:
    get:
      tags: [RunControl]
      operationId: listRunCheckpoints
      description: >-
        运行检查点列表（能力键 checkpoint.read）。Checkpoint 不可变：inputDigest/outputRefs/
        authorizationSnapshot/budgetSnapshot；恢复（RESUME）前必须重新预检而非直接回放。
        targetType ∈ AGENT_SESSION/EXECUTION_TASK。负向：目标不存在 404、跨 Workspace 403、
        非法 targetType 422。
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - name: targetType
          in: path
          required: true
          schema: { type: string, enum: [AGENT_SESSION, EXECUTION_TASK] }
        - name: targetId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses: { '200': { $ref: '#/components/responses/CheckpointListResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /work-items:
    get:
      tags: [WorkBoard]
      operationId: listWorkItems
      parameters:
        - { $ref: '#/components/parameters/WorkspaceIdQuery' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WorkItemStatus' } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PageSizeParam' }
      responses: { '200': { $ref: '#/components/responses/WorkItemListResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [WorkBoard]
      operationId: createWorkItem
      description: >-
        WP-01A 上下文门控（裁决 QF-PD-001/002 承载面）：携带 releaseId 时，该 Release 必须存在、
        为 ACTIVE 且属于当前 Workspace，否则 409 RELEASE_NOT_IN_WORKSPACE（跨 Workspace /
        已归档 / 不存在同码拒绝）。缺 releaseId 的交付任务必填门控依赖 WP-03 TaskContract 语义，届时落地。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/WorkItemResponse' }, '409': { $ref: '#/components/responses/Conflict' } }
  /work-items/sla-overview:
    get:
      tags: [WorkBoard]
      operationId: listWorkItemSlaOverview
      description: >-
        看板 SLA 面板（M2/U3）：按优先级（P0/P1/P2）分组的 {total, met, overdue, metRate} 与整体汇总。
        SLA 口径（简单可解释）：截止时间 = created_at + 优先级窗口（P0=24h、P1=48h、P2=72h）；
        DONE/APPROVED 且 updatedAt（完成时间）不晚于截止 = met；未完成且当前时间已过截止 = overdue；
        P3 或缺失创建时间（无 due）只计入 total 不算 overdue；CANCELLED 只计入 total。
        metRate = met / total（total 为 0 时返回 0）。
      parameters: [ { $ref: '#/components/parameters/WorkspaceIdQuery' } ]
      responses: { '200': { $ref: '#/components/responses/WorkItemSlaOverviewResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
