      tags: [Platform]
      operationId: getProjectContextProjection
      description: >-
        WP-01 项目驾驶舱上下文投影（39 号 §7.2 最小切片，QF-PD-023/024 承载面）：当前
        Workspace/Release、常用项目（置顶）、lastBusinessUpdatedAt 与三类待办计数（待审核
        ReviewTask=OPEN、活跃 WorkItem∈{READY,IN_PROGRESS,PENDING_REVIEW,REWORK,BLOCKED}、
        运行中 ExecutionTask=RUNNING）。只读无写入；更新时间只来自有效业务事件。成员职责
        与环境授权投影随 WP-04/WP-06 激活扩展，不在本切片。
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
      responses: { '200': { $ref: '#/components/responses/ProjectContextProjectionResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /workspaces/{workspaceId}/pin:
    post:
      tags: [Platform]
      operationId: setWorkspacePin
      description: >-
        WP-01 常用项目固定命令（QF-PD-026 单租户体验承载面）：用户级置顶/取消置顶，
        天然幂等；登录默认工作区 = 最近置顶的常用项目，未置顶回退最近有效更新项目。
        能力键 workspace.pin；不产生领域事件（用户偏好非业务事件，口径见批次五十二）。
      parameters: [ { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspacePin' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkspacePinResponse' }, '403': { $ref: '#/components/responses/Forbidden' } }
