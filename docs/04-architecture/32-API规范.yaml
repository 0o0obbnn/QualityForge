        在同根版本集合内取版本号最大的上一版为 base（version-1 优先，缺失时取小于 head 的最大版本），
        服务端计算顶层字段级 diff（值按 JSON 等价比较）。
        base 不存在（首版）时 hasBaseline=false 且 fields 为空；base 版本链断裂同样 hasBaseline=false（降级不报错）。
