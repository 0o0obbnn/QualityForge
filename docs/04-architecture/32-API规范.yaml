    DefectSyncAttemptResponse: { description: DefectSyncAttempt, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/DefectSyncAttempt' } } } ] } } } }
    TestReportResponse: { description: TestReport, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TestReport' } } } ] } } } }
    TestReportListResponse: { description: TestReports, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TestReport' } } } } ] } } } }
    TestReportVersionResponse: { description: TestReportVersion, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TestReportVersion' } } } ] } } } }
    TestReportVersionListResponse: { description: TestReportVersions, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TestReportVersion' } } } } ] } } } }
    QualityGateResponse: { description: QualityGate, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/QualityGate' } } } ] } } } }
    QualityGateListResponse: { description: QualityGates, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/QualityGate' } } } } ] } } } }
    PipelineConfigResponse: { description: PipelineConfig, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PipelineConfig' } } } ] } } } }
    PipelineRunListResponse: { description: PipelineRuns, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PipelineRun' } } } } ] } } } }

    BadRequest: { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ValidationFailed: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: State or idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthorized: { description: Authentication required or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    TooManyRequests: { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    ResponseEnvelope:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, enum: [OK] }
        message: { type: string }
        traceId: { type: string }
    ErrorEnvelope:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_CREDENTIALS, CSRF_VALIDATION_FAILED, RATE_LIMITED, SETUP_ALREADY_COMPLETED, FORBIDDEN, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, INVALID_STATE_TRANSITION, REVIEW_REQUIRED, SEPARATION_OF_DUTIES_VIOLATION, STALE_ARTIFACT_VERSION, EGRESS_DENIED, SECRET_ACCESS_DENIED, DATA_SOURCE_MISSING, RUNNER_CAPABILITY_MISSING, EXTERNAL_SYNC_CONFLICT, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
        message: { type: string }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }
    GenericObjectEnvelope:
      allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: object, additionalProperties: true } } } ]
    GenericListEnvelope:
      allOf: [ { $ref: '#/components/schemas/ResponseEnvelope' }, { type: object, properties: { data: { type: array, items: { type: object, additionalProperties: true } }, page: { type: integer }, pageSize: { type: integer }, total: { type: integer } } } ]
    UUID: { type: string, format: uuid }
    ReviewStatus: { type: string, enum: [DRAFT, GENERATING, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, PUBLISHED, REJECTED, STALE, ARCHIVED] }
    RequirementParseStatus: { type: string, enum: [DRAFT, PARSING, COMPLETED, FAILED] }
    RiskLevel: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    WorkItemStatus: { type: string, enum: [BACKLOG, READY, IN_PROGRESS, PENDING_REVIEW, REWORK, APPROVED, BLOCKED, DONE, CANCELLED] }
    ReviewTaskStatus: { type: string, enum: [OPEN, IN_PROGRESS, APPROVED, CHANGES_REQUESTED, REJECTED, EXPIRED, CANCELLED] }
    WorkItem:
      type: object
      required: [id, tenantId, workspaceId, workItemType, title, objective, acceptanceCriteria, requiresReview, lockVersion, status, currentActorType, priority, riskLevel, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        tenantId: { $ref: '#/components/schemas/UUID' }
        workspaceId: { $ref: '#/components/schemas/UUID' }
        releaseId: { $ref: '#/components/schemas/UUID', description: "可空:探索性缺陷无 Release 归属(裁决 2026-08-15 B6)" }
        testPlanId: { $ref: '#/components/schemas/UUID' }
        parentWorkItemId: { $ref: '#/components/schemas/UUID' }
        workItemType: { type: string, enum: [STRATEGY, PLAN, TEST_DESIGN, AUTOMATION_WEB, AUTOMATION_API, EXECUTION, RESULT_ANALYSIS, DEFECT, REPORT, KNOWLEDGE, GENERAL] }
        title: { type: string, maxLength: 256 }
        description: { type: string }
        objective: { type: string, description: 测试目标而非操作步骤 }
        acceptanceCriteria: { type: string, description: 完成判据，由测试人员创建或确认 }
        constraints: { type: string, description: 约束与限制条件 }
        agentId: { type: string, format: uuid, description: 当前处理 Agent 引用 }
        requiresReview: { type: boolean, description: 是否必须创建审核工单，正式产出默认 true }
        lockVersion: { type: integer, description: 乐观锁版本，防止并发审核覆盖 }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        currentActorType: { type: string, enum: [HUMAN, AGENT, SERVICE, SYSTEM, NONE], description: "与 33 四值对齐补 SERVICE(裁决 2026-08-15 B14)" }
        currentActorId: { type: string, format: uuid }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        ownerId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        blockedReasonCode: { type: string }
        blockedDetails: { type: object, additionalProperties: true }
        dueAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkItemCreate:
      type: object
      required: [workspaceId, workItemType, title, objective, acceptanceCriteria, requiresReview, priority, riskLevel]
      properties:
        workspaceId: { $ref: '#/components/schemas/UUID' }
        releaseId: { $ref: '#/components/schemas/UUID' }
        testPlanId: { $ref: '#/components/schemas/UUID' }
        parentWorkItemId: { $ref: '#/components/schemas/UUID' }
        workItemType: { type: string, enum: [STRATEGY, PLAN, TEST_DESIGN, AUTOMATION_WEB, AUTOMATION_API, EXECUTION, RESULT_ANALYSIS, DEFECT, REPORT, KNOWLEDGE, GENERAL] }
        title: { type: string }
        description: { type: string }
        objective: { type: string, description: 测试目标而非操作步骤 }
        acceptanceCriteria: { type: string, description: 完成判据，由测试人员创建或确认 }
        constraints: { type: string, description: 约束与限制条件 }
        agentId: { type: string, format: uuid, description: 当前处理 Agent 引用 }
        requiresReview: { type: boolean, default: true, description: 是否必须创建审核工单 }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        reviewPolicyId: { $ref: '#/components/schemas/UUID' }
    WorkItemTransition:
      type: object
      required: [targetStatus, reason, lockVersion]
      properties:
        targetStatus: { $ref: '#/components/schemas/WorkItemStatus' }
        reason: { type: string }
        expectedCurrentStatus: { $ref: '#/components/schemas/WorkItemStatus' }
        lockVersion: { type: integer, minimum: 0, description: "乐观锁版本(M1-B1 契约先行,墙 M-120 双确认)；与服务端当前值不一致时 409" }
    WorkItemAssignRequest:
      type: object
      required: [workspaceId, assigneeId]
      description: "工作项分派请求（M2/U4）：assigneeId 必填；重复分派同一 assignee 幂等成功"
      properties:
        workspaceId: { $ref: '#/components/schemas/UUID' }
        assigneeId: { $ref: '#/components/schemas/UUID' }
    WorkItemSlaGroup:
      type: object
      required: [priority, total, met, overdue, metRate]
      properties:
        priority: { type: string, enum: [P0, P1, P2] }
        total: { type: integer, description: 该优先级工作项总数 }
        met: { type: integer, description: 截止前完成数（DONE/APPROVED 且 updatedAt <= 截止） }
        overdue: { type: integer, description: 未完成且当前时间已过截止数 }
        metRate: { type: number, description: "met / total，total 为 0 时为 0" }
    WorkItemSlaOverview:
      type: object
      required: [overall, groups]
      properties:
        overall:
          type: object
          required: [total, met, overdue, metRate]
          properties:
            total: { type: integer, description: 工作区内全部工作项（含 P3 与 CANCELLED） }
            met: { type: integer }
            overdue: { type: integer }
            metRate: { type: number }
        groups:
          type: array
          items: { $ref: '#/components/schemas/WorkItemSlaGroup' }
          description: 按优先级 P0/P1/P2 分组；P3 无 SLA 承诺不占组
    ReviewTask:
      type: object
      required: [id, workItemId, artifactType, artifactId, artifactVersionId, contentDigest, policyType, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workItemId: { $ref: '#/components/schemas/UUID' }
        agentSessionId: { $ref: '#/components/schemas/UUID', description: 可选：AI 生成场景记录 AgentSession；人工直接修改提交审核时为空（裁决 2026-08-14 批次二） }
        artifactType: { type: string }
        artifactId: { $ref: '#/components/schemas/UUID' }
        artifactVersionId: { $ref: '#/components/schemas/UUID' }
        contentDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        policyType: { type: string, enum: [SINGLE_REVIEW, FOUR_EYES, CODE_REVIEW, EXTERNAL_WRITE, REPORT_SIGNOFF, KNOWLEDGE_PUBLISH], description: "风险分级审核政策（QF-PD-007，WP-05 切片二实现）：自动创建的任务按 WorkItem riskLevel 服务端派生——CRITICAL → FOUR_EYES，其余 → SINGLE_REVIEW；04 号 ReviewPolicy 配置面 CRUD 后置，平台最低基线只能调严" }
        minApprovers: { type: integer, minimum: 1, description: "最少不同审批人数：SINGLE_REVIEW=1、FOUR_EYES=2（WP-05 切片二）" }
        approvals: { type: array, items: { type: object, additionalProperties: true }, description: "已记录的批准决定（actorId/comments/decidedAt），FOUR_EYES 逐人追加：达标才置任务 APPROVED 与版本 reviewStatus=APPROVED，部分批准任务 IN_PROGRESS；同一审批人二次批准 409 FOUR_EYES_SAME_APPROVER（单人绕过双审被拒）；退回（REQUEST_CHANGES/REJECT）不要求双人（06 号 §9 阻断项直接退回）。AI 自批由 AGENT 角色门拒绝（AI 无审核权）；人侧 separationRules 属 ReviewPolicy 配置面（V1 单人可兼任，QF-PD-001）" }
        status: { $ref: '#/components/schemas/ReviewTaskStatus' }
        approveDisabledReason: { type: string, nullable: true, enum: [TASK_CLOSED, STALE_VERSION, PERMISSION_DENIED, PRECONDITION_PENDING], description: "服务端计算的批准禁用原因(M1-B1 契约先行,墙 M-120 双确认)；null 表示可批准。TASK_CLOSED=任务已结束；STALE_VERSION=任务摘要落后于产出物当前版本；PERMISSION_DENIED/PRECONDITION_PENDING 预留后续能力与前置条件校验" }
        assignments: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReviewArtifact:
      type: object
      required: [artifactType, artifactId, artifactVersionId, contentDigest, content]
      properties:
        artifactType: { type: string, enum: [TEST_STRATEGY, TEST_PLAN, TEST_CASE] }
        artifactId: { $ref: '#/components/schemas/UUID' }
        artifactVersionId: { $ref: '#/components/schemas/UUID' }
        contentDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        content: { type: object, additionalProperties: true }
    ReviewArtifactDiffField:
      type: object
      required: [field, changeType]
      properties:
        field: { type: string, description: content 顶层字段名 }
        changeType: { type: string, enum: [ADDED, REMOVED, CHANGED] }
        oldValue: { description: base 版本字段值（ADDED 时省略） }
        newValue: { description: head 版本字段值（REMOVED 时省略） }
    ReviewArtifactDiff:
      type: object
      required: [artifactType, artifactId, artifactVersionId, hasBaseline, changedCount, fields]
      properties:
        artifactType: { type: string, enum: [TEST_STRATEGY, TEST_PLAN, TEST_CASE, DEFECT_VERSION, TEST_REPORT_VERSION] }
        artifactId: { $ref: '#/components/schemas/UUID' }
        artifactVersionId: { $ref: '#/components/schemas/UUID' }
        baseVersionId: { nullable: true, allOf: [ { $ref: '#/components/schemas/UUID' } ], description: 同根上一版版本 id；无上一版时 null }
        headDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        baseDigest: { nullable: true, type: string, pattern: '^[a-f0-9]{64}$', description: hasBaseline=false 时 null }
        hasBaseline: { type: boolean, description: 首版或 base 链断裂时为 false（降级不报错） }
        changedCount: { type: integer, description: fields 条目数 }
        fields: { type: array, items: { $ref: '#/components/schemas/ReviewArtifactDiffField' }, description: 顶层字段级 diff，按字段名字典序 }
    LocalAuthStatus:
      type: object
      required: [setupRequired, authenticated, profile]
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
        profile:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/LocalAuthProfile' } ]
    LocalAuthProfile:
      type: object
      required: [userId, tenantId, workspaceId, email, actorType, capabilities]
      properties:
        userId: { $ref: '#/components/schemas/UUID' }
        tenantId: { $ref: '#/components/schemas/UUID' }
        workspaceId: { $ref: '#/components/schemas/UUID' }
        email: { type: string, format: email }
        actorType: { type: string, enum: [HUMAN, AGENT, SERVICE, SYSTEM], description: "与 33 actor_type 四值对齐,USER→HUMAN(裁决 2026-08-15 B14)" }
        capabilities: { type: array, items: { type: string } }
    LocalSetupCreate:
      type: object
      required: [email, password, tenantName, workspaceName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        tenantName: { type: string, minLength: 1, maxLength: 120 }
        workspaceName: { type: string, minLength: 1, maxLength: 120 }
    LoginCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
    WorkspaceSwitch: { type: object, required: [workspaceId], properties: { workspaceId: { $ref: '#/components/schemas/UUID' } } }
    WorkspacePin: { type: object, required: [pinned], properties: { pinned: { type: boolean } } }
    WorkspaceRef: { type: object, required: [id, name, lastBusinessUpdatedAt], properties: { id: { $ref: '#/components/schemas/UUID' }, name: { type: string }, lastBusinessUpdatedAt: { type: string, format: date-time } } }
    ProjectContextProjection:
      type: object
      required: [workspace, currentRelease, pinnedWorkspaces, openReviewCount, activeWorkItemCount, runningExecutionCount]
      properties:
        workspace: { $ref: '#/components/schemas/WorkspaceRef' }
        currentRelease: { type: object, nullable: true, required: [id, name, status], properties: { id: { $ref: '#/components/schemas/UUID' }, name: { type: string }, status: { type: string } } }
        pinnedWorkspaces: { type: array, items: { $ref: '#/components/schemas/WorkspaceRef' } }
        openReviewCount: { type: integer, minimum: 0 }
        activeWorkItemCount: { type: integer, minimum: 0 }
        runningExecutionCount: { type: integer, minimum: 0 }
    ReviewTaskCreate:
      type: object
      required: [workItemId, artifactType, artifactId, artifactVersionId, contentDigest, policyType]
      properties:
        workItemId: { $ref: '#/components/schemas/UUID' }
        artifactType: { type: string }
        artifactId: { $ref: '#/components/schemas/UUID' }
        artifactVersionId: { $ref: '#/components/schemas/UUID' }
        contentDigest: { type: string }
        policyType: { type: string }
        assignees: { type: array, items: { type: object, required: [userId, reviewRole, requiredCapability], properties: { userId: { $ref: '#/components/schemas/UUID' }, reviewRole: { type: string, enum: [REVIEWER, APPROVER] }, requiredCapability: { type: string } } } }
    ReviewDecisionCreate:
      type: object
      required: [decision, contentDigest]
      properties:
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGES, REJECT] }
        contentDigest: { type: string }
        comments: { type: string }
        signature: { type: string, writeOnly: true }
    SourceImportCreate:
      type: object
      required: [workspaceId, sourceType]
      properties:
        workspaceId: { $ref: '#/components/schemas/UUID' }
        sourceType: { type: string, enum: [OPENAPI_FILE, OPENAPI_URL, REPOSITORY, MANUAL, TRAFFIC, OTHER] }
        sourceIntegrationId: { $ref: '#/components/schemas/UUID' }
        sourceLocator: { type: string }
        rawContent: { type: string, writeOnly: true }
        expectedDigest: { type: string }
    RequirementDocument:
      type: object
      required: [id, tenantId, workspaceId, name, documentType, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        tenantId: { $ref: '#/components/schemas/UUID' }
        workspaceId: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        documentType: { type: string }
        currentVersionId: { $ref: '#/components/schemas/UUID' }
        publishedVersionId: { $ref: '#/components/schemas/UUID' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
    RequirementDocumentVersion:
      type: object
      required: [id, requirementDocumentId, version, sourceSnapshotId, parseStatus, reviewStatus, contentDigest, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        requirementDocumentId: { $ref: '#/components/schemas/UUID' }
        version: { type: integer, minimum: 1 }
        sourceSnapshotId: { $ref: '#/components/schemas/UUID' }
        parseStatus: { $ref: '#/components/schemas/RequirementParseStatus' }
        reviewStatus: { $ref: '#/components/schemas/ReviewStatus' }
        contentDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        changeSummary: { type: string }
        createdAt: { type: string, format: date-time }
    RequirementDocumentCreate: { type: object, required: [workspaceId, name, documentType], properties: { workspaceId: { $ref: '#/components/schemas/UUID' }, name: { type: string, minLength: 1, maxLength: 256 }, documentType: { type: string, minLength: 1, maxLength: 50 } } }
    RequirementDocumentVersionCreate: { type: object, required: [sourceSnapshotId, contentDigest, content], properties: { sourceSnapshotId: { $ref: '#/components/schemas/UUID' }, contentDigest: { type: string, pattern: '^[a-f0-9]{64}$' }, content: { type: string, minLength: 1, writeOnly: true }, changeSummary: { type: string } } }
    APIContract:
      type: object
      required: [id, workspaceId, name, serviceKey, protocol, status]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspaceId: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        serviceKey: { type: string }
        protocol: { type: string, enum: [HTTP_REST, GRAPHQL, GRPC, ASYNC_API, OTHER] }
        description: { type: string }
        currentVersionId: { $ref: '#/components/schemas/UUID' }
        publishedVersionId: { $ref: '#/components/schemas/UUID' }
        status: { type: string, enum: [ACTIVE, DEPRECATED, ARCHIVED] }
    APIContractCreate: { type: object, required: [workspaceId, name, serviceKey, protocol], properties: { workspaceId: { $ref: '#/components/schemas/UUID' }, name: { type: string }, serviceKey: { type: string }, protocol: { type: string }, description: { type: string } } }
    APIContractVersionCreate:
      type: object
      required: [sourceSnapshotIds, sourceKind]
      properties:
        sourceSnapshotIds: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UUID' } }
        sourceKind: { type: string, enum: [DECLARED, OBSERVED, MANUAL, MERGED] }
        normalizedSpec: { type: object, writeOnly: true, additionalProperties: true }
        changeSummary: { type: string }
    APIContractBaselineCreate: { type: object, required: [workspaceId, releaseId, purpose, entries], properties: { workspaceId: { $ref: '#/components/schemas/UUID' }, releaseId: { $ref: '#/components/schemas/UUID' }, purpose: { type: string, enum: [TEST_DESIGN, MOCK, CONTRACT_ANALYSIS] }, entries: { type: array, items: { type: object, required: [apiContractId, apiContractVersionId, normalizedDigest], properties: { apiContractId: { $ref: '#/components/schemas/UUID' }, apiContractVersionId: { $ref: '#/components/schemas/UUID' }, normalizedDigest: { type: string } } } } } }
    KnowledgeEntryCreate: { type: object, required: [workspaceId, knowledgeKey, category], properties: { workspaceId: { $ref: '#/components/schemas/UUID' }, knowledgeKey: { type: string }, category: { type: string } } }
    KnowledgeEntryVersionCreate: { type: object, required: [title, content, applicableScope, invalidConditions, contentDigest], properties: { title: { type: string }, content: { type: string, writeOnly: true }, applicableScope: { type: object, additionalProperties: true }, invalidConditions: { type: array, items: { type: string } }, contentDigest: { type: string }, changeSummary: { type: string } } }
    KnowledgeSearchRequest: { type: object, required: [workspaceId, query], properties: { workspaceId: { $ref: '#/components/schemas/UUID' }, query: { type: string }, topK: { type: integer, minimum: 1, maximum: 50, default: 10 }, filters: { type: object, additionalProperties: true } } }
    TestStrategy:
