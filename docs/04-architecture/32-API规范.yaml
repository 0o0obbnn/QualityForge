    RuntimeAuthorization:
      type: object
      required: [id, workItemId, action, permissionKeys, decidedBy, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workItemId: { $ref: '#/components/schemas/UUID' }
        action: { type: string, enum: [AUTHORIZE, REVOKE] }
        permissionKeys: { type: array, items: { type: string } }
        resourceScope: { type: object, additionalProperties: true }
        secretRefs: { type: array, items: { $ref: '#/components/schemas/UUID' } }
        budgetDelta: { type: object, additionalProperties: true }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        decidedBy: { $ref: '#/components/schemas/UUID' }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        createdAt: { type: string, format: date-time }
    BudgetPolicyUpdate:
      type: object
      properties:
        tokenLimit: { type: integer, minimum: 0 }
        costLimit: { type: number, minimum: 0 }
        timeLimitMinutes: { type: integer, minimum: 1 }
        concurrencyLimit: { type: integer, minimum: 1 }
        retryLimit: { type: integer, minimum: 0 }
        warningThresholds: { type: object, additionalProperties: { type: number } }
    BudgetPolicy:
      type: object
      required: [id, workspaceId, limits, status]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspaceId: { $ref: '#/components/schemas/UUID' }
        workItemId: { $ref: '#/components/schemas/UUID' }
        limits:
          type: object
          required: [tokenLimit, costLimit, timeLimitMinutes, concurrencyLimit, retryLimit]
          properties:
            tokenLimit: { type: integer, minimum: 0 }
            costLimit: { type: number, minimum: 0 }
            timeLimitMinutes: { type: integer, minimum: 1 }
            concurrencyLimit: { type: integer, minimum: 1 }
            retryLimit: { type: integer, minimum: 0 }
        warningThresholds: { type: object, additionalProperties: { type: number } }
        consumed: { type: object, additionalProperties: true }
        status: { type: string, enum: [NORMAL, WARNING, EXCEEDED_PAUSED] }
    Checkpoint:
      type: object
      required: [id, targetType, targetId, stage, inputDigest, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        targetType: { type: string, enum: [AGENT_SESSION, EXECUTION_TASK] }
        targetId: { $ref: '#/components/schemas/UUID' }
        stage: { type: string }
        inputDigest: { type: string, minLength: 64, maxLength: 64 }
        outputRefs: { type: array, items: { type: string } }
        authorizationSnapshot: { type: object, additionalProperties: true }
        budgetSnapshot: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
